name: Run Manhwa Scraper

on:
  schedule:
    - cron: '0 */6 * * *' # Triggers automatically every 6 hours
  workflow_dispatch: # Allows clicking a button to run it manually anytime

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 firebase-admin

      - name: Verify Firebase Secret
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_JSON_SECRET }}
        run: |
          if [ -z "$FIREBASE_SECRET" ]; then
            echo "::error::FIREBASE_JSON_SECRET is missing! Add it in Repo Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Run Scraper Script
        env:
          FIREBASE_JSON_SECRET: ${{ secrets.FIREBASE_JSON_SECRET }}
        run: python scraper.py
