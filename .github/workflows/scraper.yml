name: Run Manhwa Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 firebase-admin

      - name: Write Firebase Key from GitHub Secret
        env:
          FIREBASE_KEY_CONTENT: ${{ secrets.FIREBASE_JSON_SECRET }}
        run: |
          if [ -z "$FIREBASE_KEY_CONTENT" ]; then
            echo "::error::FIREBASE_JSON_SECRET is not set! Please add it in Repo Settings -> Secrets -> Actions."
            exit 1
          fi
          echo "$FIREBASE_KEY_CONTENT" > firebase-key.json

      - name: Run Scraper Script
        env:
          FIREBASE_JSON_SECRET: ${{ secrets.FIREBASE_JSON_SECRET }}
        run: |
          python scraper.py

      - name: Clean up Credentials
        if: always()
        run: |
          rm -f firebase-key.json
